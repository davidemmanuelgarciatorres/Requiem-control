[project]
name = "requiem-control-backend"
version = "0.2.0"
description = "REQUIEM CONTROL — API de aplicación (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.165,<1",
  "sqlalchemy>=2.1,<3",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.3,<4",
  "argon2-cffi>=25.1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "email-validator>=2.4",
  "pandas>=3,<4",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20",
  "anthropic>=2.14,<3",
  "httpx2>=2.16,<3",
  "pillow>=12",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.28", "ruff>=0.17", "mypy>=2.4", "pandas-stubs", "types-openpyxl"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608", "E501", "RUF059"]
"migrations/*" = ["E501", "S608"]  # SQL construido solo con constantes del propio archivo
"app/assistant.py" = ["E501"]  # frases bilingües largas

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", ".venv/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

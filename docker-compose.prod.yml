# Despliegue de REQUIEM CONTROL con contenedores (un servidor/VPS o cualquier plataforma compatible).
# Uso:  cp .env.production.example .env.production  (y completa los valores)
#       docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# El HTTPS lo pone el proveedor o un proxy delante del puerto 8080.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?}
      APP_PASSWORD: ${APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-requiem.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env.production
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://requiem_owner:${OWNER_PASSWORD}@db:5432/requiem_control
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://requiem_app:${APP_PASSWORD}@db:5432/requiem_control
      MIGRATION_DATABASE_URL: postgresql+psycopg://requiem_owner:${OWNER_PASSWORD}@db:5432/requiem_control
      EXECUTION_MODE: worker
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    healthcheck:
      disable: true  # el worker no expone HTTP
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://requiem_app:${APP_PASSWORD}@db:5432/requiem_control
      MIGRATION_DATABASE_URL: postgresql+psycopg://requiem_owner:${OWNER_PASSWORD}@db:5432/requiem_control
      EXECUTION_MODE: worker
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
